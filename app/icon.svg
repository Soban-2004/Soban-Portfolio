    <rect x="22" y="22" width="4" height="4"/>
    <rect x="6" y="26" width="4" height="4"/><rect x="10" y="26" width="4" height="4"/><rect x="14" y="26" width="4" height="4"/><rect x="18" y="26" width="4" height="4"/>
