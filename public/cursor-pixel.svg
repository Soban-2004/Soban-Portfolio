<svg xmlns="http://www.w3.org/2000/svg" width="16" height="20" viewBox="0 0 16 20" shape-rendering="crispEdges">
  <filter id="o" x="-30%" y="-30%" width="160%" height="160%">
    <feMorphology in="SourceAlpha" operator="dilate" result="dilated" radius="1"/>
    <feFlood flood-color="#04140c" result="outline-color"/>
    <feComposite in="outline-color" in2="dilated" operator="in" result="outline"/>
    <feMerge>
      <feMergeNode in="outline"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <g filter="url(#o)" fill="#3ecf8e">
